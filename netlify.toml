# Netlify auto-detects Next.js and provisions the Next.js Runtime (v5),
# so we do NOT declare @netlify/plugin-nextjs or a publish dir here —
# the adapter manages the build output. We only pin the Node version and
# the build command explicitly.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # EMAIL_FROM is the public sender address (shown in the email "From" header),
  # used only in server-side code. It is not a secret, so exclude it from
  # Netlify's secret scanner, which otherwise fails the build on finding it
  # in the server build output. Real secrets (DATABASE_URL, RESEND_API_KEY,
  # AUTH_SECRET, GOOGLE_CLIENT_SECRET) are runtime-only and stay scanned.
  # COURSE_PRICE_KOBO is a public price (shown on the unlock page), not a
  # secret. PAYSTACK_SECRET_KEY is deliberately NOT listed — it must stay
  # scanned; it is runtime-only and never in build output.
  SECRETS_SCAN_OMIT_KEYS = "EMAIL_FROM,COURSE_PRICE_KOBO"
